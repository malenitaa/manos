version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # a new version waits a week before it gets a PR
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"] # one weekly PR for the small ones; majors come alone
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
