name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities
        run: npm audit
      - run: npm test --if-present
      - name: Typecheck and build
        run: npm run build
      - name: MediaPipe runtime is in the build
        run: test -f dist/mediapipe/vision_wasm_internal.wasm
