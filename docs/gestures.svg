<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="The gesture language of manos: one hand builds the chord, the other shapes the sound">
  <!-- Drawn in the app's own visual language: skeleton hands, a golden wave,
       the chord name in serif. Colours mirror src/styles/main.css. -->
  <rect width="1200" height="640" fill="#0d0f14"/>

  <!-- wordmark -->
  <text x="600" y="66" fill="#8b8878" font-family="Georgia, serif" font-size="30" letter-spacing="14" text-anchor="middle">m a n o s</text>

  <!-- the chord that is sounding -->
  <text x="600" y="180" fill="#f4f1ea" font-family="Georgia, serif" font-size="72" text-anchor="middle">Amaj7</text>
  <text x="600" y="216" fill="#8b8878" font-family="Georgia, serif" font-size="21" font-style="italic" text-anchor="middle">the same lean that plays A turns it into Am, A7 or Amaj7</text>

  <!-- ============ left hand: builds the chord (4 fingers, thumb folded) ============ -->
  <g transform="translate(46,0)">
    <g stroke="#5d6576" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- palm -->
      <path d="M280 520 L232 402 M280 520 L270 392 M280 520 L307 396 M280 520 L341 410"/>
      <path d="M232 402 L270 392 L307 396 L341 410"/>
      <path d="M280 520 L245 490"/>
      <!-- thumb, folded across the palm -->
      <path d="M245 490 L222 462 L230 440 L252 430"/>
      <!-- index -->
      <path d="M232 402 L222 344 L216 300 L212 262"/>
      <!-- middle -->
      <path d="M270 392 L266 326 L263 280 L261 238"/>
      <!-- ring -->
      <path d="M307 396 L309 334 L311 290 L312 252"/>
      <!-- pinky -->
      <path d="M341 410 L350 360 L355 324 L359 292"/>
    </g>
    <g fill="#cfd6e4">
      <circle cx="280" cy="520" r="5"/>
      <circle cx="245" cy="490" r="4"/><circle cx="222" cy="462" r="4"/><circle cx="230" cy="440" r="4"/><circle cx="252" cy="430" r="4.5"/>
      <circle cx="232" cy="402" r="4"/><circle cx="222" cy="344" r="4"/><circle cx="216" cy="300" r="4"/>
      <circle cx="270" cy="392" r="4"/><circle cx="266" cy="326" r="4"/><circle cx="263" cy="280" r="4"/>
      <circle cx="307" cy="396" r="4"/><circle cx="309" cy="334" r="4"/><circle cx="311" cy="290" r="4"/>
      <circle cx="341" cy="410" r="4"/><circle cx="350" cy="360" r="4"/><circle cx="355" cy="324" r="4"/>
    </g>
    <!-- counting fingertips, golden -->
    <g fill="#d9b45f">
      <circle cx="212" cy="262" r="6"/><circle cx="261" cy="238" r="6"/><circle cx="312" cy="252" r="6"/><circle cx="359" cy="292" r="6"/>
    </g>
    <g fill="#d9b45f" font-family="Georgia, serif" font-size="19" text-anchor="middle">
      <text x="212" y="244">1</text><text x="261" y="220">2</text><text x="312" y="234">3</text><text x="361" y="274">4</text>
    </g>
    <!-- the lean arc, bulging gently below the wrist -->
    <path d="M200 552 A 112 40 0 0 0 380 552" stroke="#8b8878" stroke-width="2" fill="none" stroke-dasharray="3 6"/>
    <path d="M208 546 L198 553 L209 559" stroke="#8b8878" stroke-width="2" fill="none"/>
    <path d="M372 546 L382 553 L371 559" stroke="#8b8878" stroke-width="2" fill="none"/>
  </g>
  <text x="336" y="592" fill="#b9b4a4" font-family="Georgia, serif" font-size="20" text-anchor="middle">lean: minor ← plain → seventh</text>

  <!-- left labels -->
  <g font-family="Georgia, serif">
    <text x="40" y="246" fill="#b9b4a4" font-size="20">1–4 fingers</text>
    <text x="40" y="272" fill="#8b8878" font-size="17">— the degree, I to IV</text>
    <text x="40" y="296" fill="#8b8878" font-size="17">the thumb adds V, VI, VII</text>
    <text x="40" y="430" fill="#b9b4a4" font-size="20">raise or lower — the octave</text>
  </g>
  <path d="M58 444 L58 476 M52 454 L58 446 L64 454 M52 468 L58 476 L64 468" stroke="#57534a" stroke-width="1.5" fill="none"/>

  <!-- ============ right hand: shapes the sound (open, five out) ============ -->
  <g stroke="#5d6576" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M900 545 L856 428 M900 545 L894 418 M900 545 L930 424 M900 545 L962 438"/>
    <path d="M856 428 L894 418 L930 424 L962 438"/>
    <path d="M900 545 L858 515"/>
    <path d="M858 515 L826 488 L806 462 L792 438"/>
    <path d="M856 428 L846 372 L840 332 L835 296"/>
    <path d="M894 418 L892 354 L890 310 L889 270"/>
    <path d="M930 424 L936 364 L940 322 L943 286"/>
    <path d="M962 438 L974 392 L980 358 L985 328"/>
  </g>
  <g fill="#cfd6e4">
    <circle cx="900" cy="545" r="5"/>
    <circle cx="858" cy="515" r="4"/><circle cx="826" cy="488" r="4"/><circle cx="806" cy="462" r="4"/><circle cx="792" cy="438" r="5"/>
    <circle cx="856" cy="428" r="4"/><circle cx="846" cy="372" r="4"/><circle cx="840" cy="332" r="4"/><circle cx="835" cy="296" r="5"/>
    <circle cx="894" cy="418" r="4"/><circle cx="892" cy="354" r="4"/><circle cx="890" cy="310" r="4"/><circle cx="889" cy="270" r="5"/>
    <circle cx="930" cy="424" r="4"/><circle cx="936" cy="364" r="4"/><circle cx="940" cy="322" r="4"/><circle cx="943" cy="286" r="5"/>
    <circle cx="962" cy="438" r="4"/><circle cx="974" cy="392" r="4"/><circle cx="980" cy="358" r="4"/><circle cx="985" cy="328" r="5"/>
  </g>
  <!-- openness rays -->
  <g stroke="#57534a" stroke-width="1.5" stroke-dasharray="2 5">
    <path d="M835 288 L820 258"/><path d="M889 262 L888 230"/><path d="M943 278 L952 248"/><path d="M985 320 L1000 294"/><path d="M790 430 L768 410"/>
  </g>

  <!-- right labels -->
  <g font-family="Georgia, serif" text-anchor="end">
    <text x="1160" y="300" fill="#b9b4a4" font-size="20">height — the volume</text>
    <text x="1160" y="332" fill="#b9b4a4" font-size="20">opening it — the brightness</text>
    <text x="1160" y="364" fill="#b9b4a4" font-size="20">a fist — silence</text>
    <text x="1160" y="394" fill="#8b8878" font-size="17">2 fingers: sevenths · 1 finger: colours</text>
  </g>
  <path d="M1178 276 L1178 308 M1172 286 L1178 278 L1184 286 M1172 300 L1178 308 L1184 300" stroke="#57534a" stroke-width="1.5" fill="none"/>

  <!-- ============ the wave, as the app draws what is sounding ============ -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 610 C 120 610 150 594 210 594 S 300 626 360 626 S 450 584 510 587 C 540 589 560 610 600 610 C 640 610 660 578 700 581 S 780 630 840 627 S 930 588 990 591 S 1090 610 1140 610"
          stroke="#d9b45f" stroke-width="9" opacity="0.16"/>
    <path d="M60 610 C 120 610 150 594 210 594 S 300 626 360 626 S 450 584 510 587 C 540 589 560 610 600 610 C 640 610 660 578 700 581 S 780 630 840 627 S 930 588 990 591 S 1090 610 1140 610"
          stroke="#d9b45f" stroke-width="2.5"/>
  </g>
</svg>
